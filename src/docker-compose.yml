version: "3.8"
services:
  coder-code-server:
    image: codercom/code-server:4.146.0
    container_name: coder-code-server
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "18082:8080"
    volumes:
      - ./data:/home/coder
    environment:
      - TZ=Asia/Shanghai
      - DOCKER_USER=coder
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

x-app-meta:
  web:
    port: 18082
    protocol: http
